<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>醫院環境通報回饋後台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --blue:#1a6fa8;--blue-lt:#e8f3fb;
  --teal:#0e8f72;--teal-lt:#e4f6f1;
  --amber:#c47d0e;--amber-lt:#fef4e0;
  --red:#b83030;--red-lt:#fdeaea;
  --green:#2a7a50;--green-lt:#e6f4ed;
  --purple:#5b3ea8;--purple-lt:#eeebfb;
  --gray:#5a6575;
  --border:#dde4ed;--bg:#f0f4f9;--white:#fff;--text:#1a2332;--muted:#7a8799;
  --radius:10px;--shadow:0 2px 10px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* LOGIN */
#login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--white);border-radius:16px;box-shadow:var(--shadow);padding:36px 32px;width:100%;max-width:360px}
.login-logo{text-align:center;margin-bottom:28px}
.login-icon{width:60px;height:60px;background:var(--blue-lt);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 12px}
.login-logo h1{font-size:1.1rem;font-weight:700}
.login-logo p{font-size:0.8rem;color:var(--muted);margin-top:4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:0.72rem;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.05em;text-transform:uppercase}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:0.95rem;color:var(--text);background:var(--bg);transition:border-color .2s}
.field input:focus{outline:none;border-color:var(--blue);background:var(--white)}
.login-btn{width:100%;padding:14px;background:var(--blue);color:white;border:none;border-radius:8px;font-family:inherit;font-size:0.95rem;font-weight:700;cursor:pointer;margin-top:4px;transition:opacity .2s}
.login-btn:hover{opacity:.9}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-err{background:var(--red-lt);color:var(--red);border-radius:8px;padding:10px 14px;font-size:0.82rem;margin-top:12px;display:none}

/* MAIN */
#main-page{display:none;flex-direction:column;min-height:100vh}
.topbar{background:var(--blue);color:white;padding:0 20px;display:flex;align-items:center;height:54px;gap:12px;position:sticky;top:0;z-index:100}
.topbar-title{font-size:0.95rem;font-weight:700;flex:1}
.role-tag{font-size:0.75rem;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:999px}
.logout-btn{font-size:0.78rem;background:none;border:1px solid rgba(255,255,255,.4);color:white;padding:4px 12px;border-radius:6px;cursor:pointer;font-family:inherit}
.logout-btn:hover{background:rgba(255,255,255,.15)}
.nav-tabs{background:var(--white);border-bottom:1px solid var(--border);display:flex;padding:0 20px;overflow-x:auto}
.tab-btn{padding:12px 16px;font-size:0.85rem;font-weight:500;color:var(--muted);border:none;background:none;cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;white-space:nowrap}
.tab-btn.active{color:var(--blue);border-bottom-color:var(--blue)}
.content{padding:20px;flex:1}

/* STAT CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.stat-lbl{font-size:0.72rem;color:var(--muted);margin-bottom:6px;font-weight:500}
.stat-num{font-size:1.8rem;font-weight:700}
.c-red{color:var(--red)}.c-amber{color:var(--amber)}.c-green{color:var(--green)}.c-blue{color:var(--blue)}

/* FILTER BAR */
.filter-bar{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:999px;font-size:0.75rem;font-weight:500;border:1.5px solid var(--border);color:var(--muted);background:none;cursor:pointer;font-family:inherit;transition:all .15s}
.chip.on{border-color:var(--blue);color:var(--blue);background:var(--blue-lt)}
.chip.on-red{border-color:var(--red);color:var(--red);background:var(--red-lt)}
.chip.on-amber{border-color:var(--amber);color:var(--amber);background:var(--amber-lt)}
.chip.on-green{border-color:var(--green);color:var(--green);background:var(--green-lt)}
.sep{width:1px;height:16px;background:var(--border);flex-shrink:0}
.spacer{flex:1}
.refresh-btn{padding:6px 12px;border-radius:8px;font-size:0.75rem;font-weight:500;border:1.5px solid var(--border);color:var(--muted);background:none;cursor:pointer;font-family:inherit}
.refresh-btn:hover{border-color:var(--blue);color:var(--blue)}

/* TABLE */
.table-wrap{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th{background:#f5f8fc;font-size:0.72rem;font-weight:700;color:var(--muted);padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;letter-spacing:.04em}
td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:0.82rem;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafcff}

.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:0.7rem;font-weight:700}
.b-wait{background:var(--red-lt);color:var(--red)}
.b-doing{background:var(--amber-lt);color:var(--amber)}
.b-done{background:var(--green-lt);color:var(--green)}
.b-clean{background:var(--teal-lt);color:var(--teal)}
.b-fix{background:var(--blue-lt);color:var(--blue)}
.b-nurse{background:var(--purple-lt);color:var(--purple)}
.b-urg{background:var(--red-lt);color:var(--red)}
.b-other{background:#f0f2f5;color:var(--gray)}

.status-sel{padding:4px 8px;border:1.5px solid var(--border);border-radius:6px;font-family:inherit;font-size:0.75rem;cursor:pointer;transition:all .15s}
.status-sel:focus{outline:none;border-color:var(--blue)}
.ss-wait{border-color:var(--red);color:var(--red);background:var(--red-lt)}
.ss-doing{border-color:var(--amber);color:var(--amber);background:var(--amber-lt)}
.ss-done{border-color:var(--green);color:var(--green);background:var(--green-lt)}

.act-btn{padding:4px 10px;border-radius:6px;font-size:0.72rem;font-weight:700;border:1.5px solid;cursor:pointer;font-family:inherit;white-space:nowrap;transition:all .15s;margin-right:3px}
.btn-accept{border-color:var(--blue);color:var(--blue);background:var(--blue-lt)}.btn-accept:hover{background:var(--blue);color:white}
.btn-done{border-color:var(--green);color:var(--green);background:var(--green-lt)}.btn-done:hover{background:var(--green);color:white}
.empty-td{text-align:center;color:var(--muted);padding:32px!important;font-size:0.85rem}

/* 照片縮圖按鈕 */
.photo-thumb-btn{
  width:40px;height:40px;border-radius:6px;overflow:hidden;
  border:1.5px solid var(--border);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--bg);transition:all .15s;flex-shrink:0;
}
.photo-thumb-btn:hover{border-color:var(--blue);transform:scale(1.05)}
.photo-thumb-btn img{width:100%;height:100%;object-fit:cover}
.no-photo{font-size:0.7rem;color:var(--muted)}

/* 照片 Modal */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.75);
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  animation:fadeIn .2s ease;
}
.modal-overlay.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-box{
  background:var(--white);
  border-radius:14px;
  overflow:hidden;
  max-width:600px;
  width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.modal-header{
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-title{font-size:0.9rem;font-weight:700}
.modal-info{font-size:0.78rem;color:var(--muted);margin-top:2px}
.modal-close{
  width:32px;height:32px;border-radius:8px;border:none;
  background:var(--bg);color:var(--muted);font-size:1rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.modal-close:hover{background:var(--red-lt);color:var(--red)}
.modal-img-wrap{
  background:#000;
  display:flex;align-items:center;justify-content:center;
  min-height:200px;max-height:70vh;overflow:hidden;
}
.modal-img{max-width:100%;max-height:70vh;object-fit:contain;display:block}
.modal-footer{
  padding:12px 18px;
  border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
}
.modal-open-btn{
  padding:8px 16px;background:var(--blue);color:white;border:none;
  border-radius:8px;font-family:inherit;font-size:0.83rem;font-weight:700;
  cursor:pointer;text-decoration:none;display:inline-block;
}
.modal-open-btn:hover{opacity:.9}

/* ROOMS */
.rooms-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:800px){.rooms-layout{grid-template-columns:1fr}}
.panel{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-hd{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-title{font-size:0.9rem;font-weight:700}
.panel-bd{padding:16px 18px}
.col-lbl{display:grid;grid-template-columns:1fr 1fr 36px;gap:8px;margin-bottom:8px}
.col-lbl span{font-size:0.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-left:4px}
.room-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:400px;overflow-y:auto}
.room-row{display:grid;grid-template-columns:1fr 1fr 36px;gap:8px;align-items:center}
.room-row input{padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:0.83rem;color:var(--text);background:var(--bg);width:100%;transition:border-color .15s}
.room-row input:focus{outline:none;border-color:var(--blue);background:var(--white)}
.room-row input::placeholder{color:var(--muted)}
.del-btn{width:36px;height:36px;border:1.5px solid var(--border);border-radius:8px;background:none;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.del-btn:hover{border-color:var(--red);color:var(--red);background:var(--red-lt)}
.add-room-btn{width:100%;padding:10px;border:1.5px dashed var(--border);border-radius:8px;background:none;font-family:inherit;font-size:0.83rem;color:var(--muted);cursor:pointer;transition:all .15s;margin-bottom:12px}
.add-room-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-lt)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.save-btn{padding:10px 20px;background:var(--blue);color:white;border:none;border-radius:8px;font-family:inherit;font-size:0.85rem;font-weight:700;cursor:pointer}
.save-btn:hover{opacity:.9}
.gen-qr-btn{padding:10px 20px;background:var(--teal);color:white;border:none;border-radius:8px;font-family:inherit;font-size:0.85rem;font-weight:700;cursor:pointer}
.gen-qr-btn:hover{opacity:.9}

/* QR */
.url-row{display:flex;gap:8px;margin-bottom:14px}
.url-row input{flex:1;padding:9px 11px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:0.8rem;color:var(--text);background:var(--bg)}
.url-row input:focus{outline:none;border-color:var(--blue);background:var(--white)}
.qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-height:500px;overflow-y:auto}
.qr-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--white)}
.qr-name{font-size:0.78rem;font-weight:700;text-align:center;color:var(--text)}
.qr-dl{width:100%;padding:5px;border:1px solid var(--border);border-radius:6px;background:none;font-family:inherit;font-size:0.7rem;font-weight:500;color:var(--blue);cursor:pointer;transition:all .15s;text-align:center}
.qr-dl:hover{background:var(--blue-lt);border-color:var(--blue)}
.qr-empty{text-align:center;color:var(--muted);font-size:0.83rem;padding:32px 16px}
.print-btn-sm{padding:6px 14px;border-radius:8px;font-size:0.78rem;font-weight:700;border:1.5px solid var(--teal);color:var(--teal);background:none;cursor:pointer;font-family:inherit}
.print-btn-sm:hover{background:var(--teal-lt)}

/* STATS */
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:16px}
.chart-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.chart-title{font-size:0.85rem;font-weight:700;margin-bottom:14px}
.chart-wrap{position:relative;height:200px}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.summary-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;text-align:center}
.summary-lbl{font-size:0.72rem;color:var(--muted);margin-bottom:4px}
.summary-val{font-size:1.5rem;font-weight:700}
.top-item{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top-name{font-size:0.8rem;min-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-bar-wrap{flex:1;background:var(--border);border-radius:4px;height:7px;overflow:hidden}
.top-bar{height:100%;background:var(--blue);border-radius:4px;transition:width .5s ease}
.top-count{font-size:0.75rem;color:var(--muted);min-width:20px;text-align:right}

/* ADMIN */
.admin-card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.admin-title{font-size:0.9rem;font-weight:700;margin-bottom:14px}
.accounts-table{width:100%;border-collapse:collapse;font-size:0.83rem}
.accounts-table th{font-size:0.72rem;font-weight:700;color:var(--muted);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);background:#f5f8fc}
.accounts-table td{padding:10px;border-bottom:1px solid var(--border)}
.accounts-table tr:last-child td{border-bottom:none}
.pw-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pw-field label{font-size:0.72rem;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.pw-field input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:0.85rem;color:var(--text);background:var(--bg);margin-top:5px;transition:border-color .15s}
.pw-field input:focus{outline:none;border-color:var(--blue);background:var(--white)}
.pw-btn{margin-top:14px;padding:10px 22px;background:var(--blue);color:white;border:none;border-radius:8px;font-family:inherit;font-size:0.85rem;font-weight:700;cursor:pointer}
.pw-msg{margin-top:10px;font-size:0.82rem;padding:8px 12px;border-radius:8px;display:none}
.pw-msg.ok{background:var(--green-lt);color:var(--green)}
.pw-msg.err{background:var(--red-lt);color:var(--red)}

/* MISC */
.loading{display:flex;align-items:center;justify-content:center;padding:36px;gap:12px;color:var(--muted);font-size:0.85rem}
.spinner{width:20px;height:20px;border:2.5px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:white;padding:10px 20px;border-radius:8px;font-size:0.85rem;font-weight:500;z-index:999;transition:transform .3s;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok-t{background:var(--green)}
.toast.err-t{background:var(--red)}
.warn-box{background:#fef4e0;border-radius:8px;padding:10px 14px;font-size:0.8rem;color:#854f0b;line-height:1.6}

@media print{
  .topbar,.nav-tabs,.panel:first-child,.url-row,.btn-row,.add-room-btn,.print-btn-sm,.qr-dl{display:none!important}
  .rooms-layout{grid-template-columns:1fr}
  .qr-grid{grid-template-columns:repeat(4,1fr);max-height:none}
  .qr-card{border:1px solid #ccc;break-inside:avoid}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-icon">🏥</div>
      <h1>醫院環境通報回饋後台</h1>
      <p>請使用分配的帳號登入</p>
    </div>
    <div class="field"><label>帳號</label><input type="text" id="username" placeholder="輸入帳號" autocomplete="username"></div>
    <div class="field"><label>密碼</label><input type="password" id="password" placeholder="輸入密碼" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">登入</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- MAIN -->
<div id="main-page">
  <div class="topbar">
    <div class="topbar-title">🏥 醫院環境通報回饋後台</div>
    <div class="role-tag" id="role-badge"></div>
    <button class="logout-btn" onclick="logout()">登出</button>
  </div>
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('records',this)">回饋管理</button>
    <button class="tab-btn" id="btn-stats" onclick="switchTab('stats',this)"  style="display:none">統計報表</button>
    <button class="tab-btn" id="btn-rooms" onclick="switchTab('rooms',this)"  style="display:none">房間管理</button>
    <button class="tab-btn" id="btn-admin" onclick="switchTab('admin',this)"  style="display:none">帳號管理</button>
  </div>

  <!-- 回饋管理 -->
  <div class="content" id="tab-records">
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-lbl">待處理</div><div class="stat-num c-red"   id="cnt-wait">—</div></div>
      <div class="stat-card"><div class="stat-lbl">處理中</div><div class="stat-num c-amber"  id="cnt-doing">—</div></div>
      <div class="stat-card"><div class="stat-lbl">已完成</div><div class="stat-num c-green"  id="cnt-done">—</div></div>
      <div class="stat-card"><div class="stat-lbl">全部</div>  <div class="stat-num c-blue"   id="cnt-all">—</div></div>
    </div>
    <div class="filter-bar">
      <button class="chip on" data-sf="all"    onclick="setSF('all',this)">全部</button>
      <button class="chip" data-sf="待處理"     onclick="setSF('待處理',this)">待處理</button>
      <button class="chip" data-sf="處理中"     onclick="setSF('處理中',this)">處理中</button>
      <button class="chip" data-sf="已完成"     onclick="setSF('已完成',this)">已完成</button>
      <div class="sep"></div>
      <button class="chip" data-tf="清潔"      onclick="setTF('清潔',this)">清潔</button>
      <button class="chip" data-tf="設備"      onclick="setTF('設備',this)">設備</button>
      <button class="chip" data-tf="安全"      onclick="setTF('安全',this)">安全</button>
      <button class="chip" data-tf="其他"      onclick="setTF('其他',this)">其他</button>
      <div class="spacer"></div>
      <button class="refresh-btn" onclick="loadRecords()">↻ 重新整理</button>
    </div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>時間</th><th>地點</th><th>類型</th><th>說明</th>
              <th>照片</th><th>狀態</th><th>負責</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="records-body">
            <tr><td colspan="8" class="empty-td"><div class="loading"><div class="spinner"></div>載入中…</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 統計報表 -->
  <div class="content" id="tab-stats" style="display:none">
    <div class="summary-grid">
      <div class="summary-card"><div class="summary-lbl">總回饋數</div><div class="summary-val c-blue"  id="s-total">—</div></div>
      <div class="summary-card"><div class="summary-lbl">完成率</div>  <div class="summary-val c-green" id="s-rate">—</div></div>
      <div class="summary-card"><div class="summary-lbl">待處理中</div><div class="summary-val c-red"   id="s-pending">—</div></div>
    </div>
    <div class="charts-grid">
      <div class="chart-card"><div class="chart-title">近期每日回饋數量</div><div class="chart-wrap"><canvas id="chart-daily"></canvas></div></div>
      <div class="chart-card"><div class="chart-title">類型分佈</div><div class="chart-wrap"><canvas id="chart-type"></canvas></div></div>
    </div>
    <div class="chart-card"><div class="chart-title">回饋最多的地點 Top 5</div><div id="top-rooms" style="margin-top:8px"></div></div>
  </div>

  <!-- 房間管理 + QR -->
  <div class="content" id="tab-rooms" style="display:none">
    <div class="rooms-layout">
      <div class="panel">
        <div class="panel-hd"><div class="panel-title">房間清單</div><span id="room-count-lbl" style="font-size:0.78rem;color:var(--muted)"></span></div>
        <div class="panel-bd">
          <div class="col-lbl"><span>房間代碼（英文）</span><span>顯示名稱</span><span></span></div>
          <div class="room-list" id="room-list"><div class="loading"><div class="spinner"></div>載入中…</div></div>
          <button class="add-room-btn" onclick="addRoomRow()">＋ 新增房間</button>
          <div class="btn-row">
            <button class="save-btn" onclick="saveRooms()">💾 儲存</button>
            <button class="gen-qr-btn" onclick="generateQR()">🔲 產生 QR Code</button>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-hd"><div class="panel-title">QR Code</div><button class="print-btn-sm" onclick="window.print()">🖨 列印全部</button></div>
        <div class="panel-bd">
          <div class="url-row"><input type="text" id="base-url" value="https://chiaoro.github.io/feedback-form/" placeholder="表單網址"></div>
          <div class="qr-grid" id="qr-grid"><div class="qr-empty">設定好房間後<br>按「產生 QR Code」</div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 帳號管理 -->
  <div class="content" id="tab-admin" style="display:none">
    <div class="admin-card">
      <div class="admin-title">所有帳號</div>
      <table class="accounts-table">
        <thead><tr><th>帳號</th><th>身份</th><th>可看的類型</th></tr></thead>
        <tbody>
          <tr><td>admin</td>  <td>管理員</td><td>全部</td></tr>
          <tr><td>clean</td>  <td>清潔組</td><td>清潔問題</td></tr>
          <tr><td>repair</td> <td>維修組</td><td>設備故障、安全疑慮</td></tr>
          <tr><td>nursing</td><td>護理站</td><td>其他、安全疑慮</td></tr>
        </tbody>
      </table>
    </div>
    <div class="admin-card">
      <div class="admin-title">修改帳號密碼</div>
      <div class="pw-grid">
        <div class="pw-field"><label>管理員密碼（確認身份）</label><input type="password" id="admin-confirm-pw" placeholder="你自己的密碼"></div>
        <div class="pw-field"><label>要修改的帳號</label><input type="text" id="target-user" placeholder="clean / repair / nursing / admin"></div>
        <div class="pw-field"><label>新密碼</label><input type="password" id="new-pw" placeholder="輸入新密碼"></div>
      </div>
      <button class="pw-btn" onclick="changePassword()">更新密碼</button>
      <div class="pw-msg" id="pw-msg"></div>
    </div>

  </div>
</div>

<!-- 照片 Modal -->
<div class="modal-overlay" id="photo-modal" onclick="closeModal(event)">
  <div class="modal-box">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-title">照片</div>
        <div class="modal-info" id="modal-info"></div>
      </div>
      <button class="modal-close" onclick="closePhotoModal()">✕</button>
    </div>
    <div class="modal-img-wrap">
      <img class="modal-img" id="modal-img" src="" alt="回饋照片">
    </div>
    <div class="modal-footer">
      <span style="font-size:0.78rem;color:var(--muted)">點擊照片外側關閉</span>
      <a class="modal-open-btn" id="modal-open-link" href="#" target="_blank">在 Drive 開啟 ↗</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ★ 換成你的 Apps Script URL
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsu7zOdVA0pI9QFz0PRSgw3aZIfgjasfLY74OpJQhG0soE09kWczBQKLtB-hqdyeso/exec";

let currentRole = "";
let currentUser = "";
let allRecords  = [];
let sf = "all";
let tf = "";
let dailyChart, typeChart;

// ── LOGIN ─────────────────────────────────────────────────────
function doLogin() {
  const user=document.getElementById("username").value.trim();
  const pass=document.getElementById("password").value.trim();
  const errEl=document.getElementById("login-err");
  const btn=document.getElementById("login-btn");
  if(!user||!pass){showLoginErr("請輸入帳號和密碼");return;}
  btn.disabled=true;btn.textContent="登入中…";errEl.style.display="none";
  post({action:"login",username:user,password:pass})
    .then(d=>{
      currentRole=d.role;currentUser=user;
      sessionStorage.setItem("role",d.role);
      sessionStorage.setItem("user",user);
      sessionStorage.setItem("label",d.label);
      enterMain(d.role,d.label);
    })
    .catch(e=>{showLoginErr(e.message||"登入失敗");btn.disabled=false;btn.textContent="登入";});
}
function showLoginErr(m){const e=document.getElementById("login-err");e.textContent=m;e.style.display="block";}

function enterMain(role,label){
  document.getElementById("login-page").style.display="none";
  document.getElementById("main-page").style.display="flex";
  document.getElementById("role-badge").textContent=label;
  ["btn-stats","btn-rooms","btn-admin"].forEach(id=>{
    document.getElementById(id).style.display = role==="admin" ? "" : "none";
  });
  loadRecords();
}

function logout(){
  sessionStorage.clear();currentRole="";currentUser="";
  document.getElementById("main-page").style.display="none";
  document.getElementById("login-page").style.display="flex";
  document.getElementById("username").value="";
  document.getElementById("password").value="";
  document.getElementById("login-err").style.display="none";
  document.getElementById("login-btn").disabled=false;
  document.getElementById("login-btn").textContent="登入";
}

// ── TABS ──────────────────────────────────────────────────────
function switchTab(tab,btn){
  ["records","stats","rooms","admin"].forEach(t=>{
    document.getElementById("tab-"+t).style.display=t===tab?"block":"none";
  });
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  if(tab==="rooms")loadRooms();
  if(tab==="stats")loadStats();
}

// ── RECORDS ───────────────────────────────────────────────────
function loadRecords(){
  document.getElementById("records-body").innerHTML=
    '<tr><td colspan="8" class="empty-td"><div class="loading"><div class="spinner"></div>載入中…</div></td></tr>';
  get({action:"getRecords",role:currentRole})
    .then(d=>{allRecords=d.records;renderRecords();})
    .catch(()=>showToast("載入失敗，請重試","err"));
}

function renderRecords(){
  let w=0,doing=0,done=0;
  allRecords.forEach(r=>{
    if(r.status==="待處理")w++;
    else if(r.status==="處理中")doing++;
    else done++;
  });
  document.getElementById("cnt-wait").textContent=w;
  document.getElementById("cnt-doing").textContent=doing;
  document.getElementById("cnt-done").textContent=done;
  document.getElementById("cnt-all").textContent=allRecords.length;

  const filtered=allRecords.filter(r=>{
    const sok=sf==="all"||r.status===sf;
    const tok=!tf||r.type.indexOf(tf)!==-1;
    return sok&&tok;
  });

  const tbody=document.getElementById("records-body");
  if(!filtered.length){tbody.innerHTML='<tr><td colspan="8" class="empty-td">沒有符合的記錄</td></tr>';return;}

  tbody.innerHTML=filtered.map(r=>{
    const tc=r.type.indexOf("清潔")!==-1?"b-clean":r.type.indexOf("設備")!==-1?"b-fix":r.type.indexOf("安全")!==-1?"b-urg":r.type.indexOf("其他")!==-1?"b-nurse":"b-other";
    const sc=r.status==="待處理"?"ss-wait":r.status==="處理中"?"ss-doing":"ss-done";

    // 照片欄
    let photoCell = "";
    if(r.photoUrl){
      // 把 Drive 網址轉成可直接顯示的縮圖網址
      const fileId = extractDriveId(r.photoUrl);
      const thumbUrl = fileId ? `https://drive.google.com/thumbnail?id=${fileId}&sz=w80` : "";
      const escapedUrl = r.photoUrl.replace(/'/g,"\\'");
      const escapedRoom = (r.roomName||r.roomCode).replace(/'/g,"\\'");
      const escapedTime = String(r.time).replace(/'/g,"\\'");
      photoCell = `<button class="photo-thumb-btn" onclick="openPhotoModal('${escapedUrl}','${escapedRoom}','${escapedTime}')" title="點擊查看照片">
        ${thumbUrl ? `<img src="${thumbUrl}" alt="照片" onerror="this.parentElement.innerHTML='📷'">` : '📷'}
      </button>`;
    } else {
      photoCell = `<span class="no-photo">—</span>`;
    }

    let acts="";
    if(r.status==="待處理")      acts=`<button class="act-btn btn-accept" onclick="updStat(${r.row},'處理中',this)">接受處理</button><button class="act-btn btn-done" onclick="updStat(${r.row},'已完成',this)">完成</button>`;
    else if(r.status==="處理中") acts=`<button class="act-btn btn-done" onclick="updStat(${r.row},'已完成',this)">標記完成</button>`;
    else                          acts=`<span style="font-size:0.72rem;color:var(--muted)">已結案</span>`;

    const t=new Date(r.time);
    const timeStr=isNaN(t)?r.time:
      (t.getMonth()+1).toString().padStart(2,"0")+"/"+t.getDate().toString().padStart(2,"0")+" "+
      t.getHours().toString().padStart(2,"0")+":"+t.getMinutes().toString().padStart(2,"0");

    return `<tr>
      <td style="color:var(--muted);white-space:nowrap;font-size:0.78rem">${timeStr}</td>
      <td style="white-space:nowrap">${r.roomName||r.roomCode}</td>
      <td><span class="badge ${tc}">${r.type}</span></td>
      <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.message}">${r.message}</td>
      <td>${photoCell}</td>
      <td><select class="status-sel ${sc}" onchange="updStat(${r.row},this.value,this)">
        <option ${r.status==="待處理"?"selected":""}>待處理</option>
        <option ${r.status==="處理中"?"selected":""}>處理中</option>
        <option ${r.status==="已完成"?"selected":""}>已完成</option>
      </select></td>
      <td style="color:var(--muted)">${r.owner}</td>
      <td>${acts}</td>
    </tr>`;
  }).join("");
}

// ── 照片 Modal ────────────────────────────────────────────────
function extractDriveId(url){
  if(!url) return "";
  // 格式1: /file/d/ID/view
  const m1=url.match(/\/file\/d\/([^/]+)/);
  if(m1) return m1[1];
  // 格式2: id=ID
  const m2=url.match(/[?&]id=([^&]+)/);
  if(m2) return m2[1];
  return "";
}

function openPhotoModal(photoUrl, roomName, time){
  const fileId=extractDriveId(photoUrl);
  // 用較大的預覽圖
  const previewUrl=fileId?`https://drive.google.com/thumbnail?id=${fileId}&sz=w800`:photoUrl;

  document.getElementById("modal-img").src=previewUrl;
  document.getElementById("modal-title").textContent="📷 "+roomName;
  document.getElementById("modal-info").textContent=time;
  document.getElementById("modal-open-link").href=photoUrl;
  document.getElementById("photo-modal").classList.add("show");
  document.body.style.overflow="hidden";
}

function closePhotoModal(){
  document.getElementById("photo-modal").classList.remove("show");
  document.getElementById("modal-img").src="";
  document.body.style.overflow="";
}

function closeModal(e){
  if(e.target===document.getElementById("photo-modal")) closePhotoModal();
}

// ESC 關閉
document.addEventListener("keydown",e=>{if(e.key==="Escape")closePhotoModal();});

// ── FILTER ────────────────────────────────────────────────────
function setSF(val,btn){
  sf=val;
  document.querySelectorAll("[data-sf]").forEach(b=>b.className="chip");
  btn.classList.add(val==="all"?"on":val==="待處理"?"on-red":val==="處理中"?"on-amber":"on-green");
  renderRecords();
}
function setTF(val,btn){
  tf=(tf===val?"":val);
  document.querySelectorAll("[data-tf]").forEach(b=>b.className="chip");
  if(tf)btn.classList.add("on");
  renderRecords();
}

function updStat(row,status,el){
  if(el)el.disabled=true;
  post({action:"updateStatus",row:row,status:status,role:currentRole})
    .then(()=>{showToast("已更新為「"+status+"」","ok");loadRecords();})
    .catch(e=>{showToast(e.message||"更新失敗","err");if(el)el.disabled=false;});
}

// ── STATS ─────────────────────────────────────────────────────
function loadStats(){
  get({action:"getStats",role:currentRole})
    .then(d=>renderStats(d.stats))
    .catch(()=>showToast("統計載入失敗","err"));
}
function renderStats(s){
  const total=Object.values(s.byStatus).reduce((a,b)=>a+b,0);
  const done=s.byStatus["已完成"]||0;
  const pending=(s.byStatus["待處理"]||0)+(s.byStatus["處理中"]||0);
  document.getElementById("s-total").textContent=total;
  document.getElementById("s-rate").textContent=total?Math.round(done/total*100)+"%":"—";
  document.getElementById("s-pending").textContent=pending;
  if(dailyChart)dailyChart.destroy();
  dailyChart=new Chart(document.getElementById("chart-daily"),{
    type:"bar",
    data:{labels:s.daily.map(d=>d.day),datasets:[{label:"回饋數",data:s.daily.map(d=>d.count),backgroundColor:"rgba(26,111,168,.75)",borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}
  });
  if(typeChart)typeChart.destroy();
  const tKeys=Object.keys(s.byType);
  typeChart=new Chart(document.getElementById("chart-type"),{
    type:"doughnut",
    data:{labels:tKeys,datasets:[{data:tKeys.map(k=>s.byType[k]),backgroundColor:["#1a6fa8","#0e8f72","#c47d0e","#b83030","#5b3ea8","#5a6575"],borderWidth:2,borderColor:"#fff"}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"right",labels:{font:{size:11},boxWidth:12}}}}
  });
  const sorted=Object.entries(s.byRoom).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const max=sorted[0]?sorted[0][1]:1;
  document.getElementById("top-rooms").innerHTML=sorted.map(([room,cnt])=>`
    <div class="top-item">
      <div class="top-name">${room}</div>
      <div class="top-bar-wrap"><div class="top-bar" style="width:${Math.round(cnt/max*100)}%"></div></div>
      <div class="top-count">${cnt}</div>
    </div>`).join("");
}

// ── ROOMS ─────────────────────────────────────────────────────
function loadRooms(){
  document.getElementById("room-list").innerHTML='<div class="loading"><div class="spinner"></div>載入中…</div>';
  get({action:"getRooms"})
    .then(d=>{const l=document.getElementById("room-list");l.innerHTML="";d.rooms.forEach(r=>addRoomRow(r.code,r.name));updateRoomCount();})
    .catch(()=>showToast("房間載入失敗","err"));
}
function addRoomRow(code="",name=""){
  const l=document.getElementById("room-list");
  const r=document.createElement("div");r.className="room-row";
  r.innerHTML=`<input type="text" class="room-code" placeholder="ward-301" value="${code}">
    <input type="text" class="room-name" placeholder="病房 301" value="${name}">
    <button class="del-btn" onclick="this.closest('.room-row').remove();updateRoomCount()">✕</button>`;
  l.appendChild(r);updateRoomCount();
}
function updateRoomCount(){document.getElementById("room-count-lbl").textContent=document.querySelectorAll(".room-row").length+" 個";}
function saveRooms(){
  const rooms=[...document.querySelectorAll(".room-row")].map(r=>({
    code:r.querySelector(".room-code").value.trim(),
    name:r.querySelector(".room-name").value.trim()
  })).filter(r=>r.code&&r.name);
  if(!rooms.length){showToast("請至少填寫一個房間","err");return;}
  post({action:"saveRooms",rooms:JSON.stringify(rooms)})
    .then(()=>showToast("房間清單已儲存 ✓","ok"))
    .catch(()=>showToast("儲存失敗","err"));
}
function generateQR(){
  const baseUrl=document.getElementById("base-url").value.trim().replace(/\/?$/,"/");
  const rooms=[...document.querySelectorAll(".room-row")].map(r=>({
    code:r.querySelector(".room-code").value.trim(),
    name:r.querySelector(".room-name").value.trim()
  })).filter(r=>r.code&&r.name);
  const grid=document.getElementById("qr-grid");
  grid.innerHTML="";
  if(!rooms.length){grid.innerHTML='<div class="qr-empty">請先新增並儲存房間</div>';return;}
  rooms.forEach(r=>{
    const url=baseUrl+"?room="+encodeURIComponent(r.code);
    const card=document.createElement("div");card.className="qr-card";
    const qrDiv=document.createElement("div");
    new QRCode(qrDiv,{text:url,width:110,height:110,colorDark:"#1a2332",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
    const nameEl=document.createElement("div");nameEl.className="qr-name";nameEl.textContent=r.name;
    const dlBtn=document.createElement("button");dlBtn.className="qr-dl";dlBtn.textContent="⬇ 下載";
    dlBtn.onclick=()=>{setTimeout(()=>{const canvas=qrDiv.querySelector("canvas");if(!canvas)return;const a=document.createElement("a");a.download="QR_"+r.code+".png";a.href=canvas.toDataURL("image/png");a.click();},100);};
    card.appendChild(qrDiv);card.appendChild(nameEl);card.appendChild(dlBtn);
    grid.appendChild(card);
  });
  showToast("已產生 "+rooms.length+" 個 QR Code","ok");
}

// ── ADMIN ─────────────────────────────────────────────────────
function changePassword(){
  const ap=document.getElementById("admin-confirm-pw").value.trim();
  const tu=document.getElementById("target-user").value.trim();
  const np=document.getElementById("new-pw").value.trim();
  if(!ap||!tu||!np){showPwMsg("err","請填寫全部欄位");return;}
  post({action:"changePassword",adminUser:currentUser,adminPass:ap,targetUser:tu,newPass:np})
    .then(()=>{showPwMsg("ok","密碼已更新！");document.getElementById("admin-confirm-pw").value="";document.getElementById("new-pw").value="";})
    .catch(e=>showPwMsg("err",e.message||"更新失敗"));
}
function showPwMsg(t,m){const e=document.getElementById("pw-msg");e.className="pw-msg "+t;e.textContent=m;e.style.display="block";setTimeout(()=>e.style.display="none",4000);}

// ── UTILS ─────────────────────────────────────────────────────
function get(params){
  const qs=Object.entries(params).map(([k,v])=>k+"="+encodeURIComponent(v)).join("&");
  return fetch(SCRIPT_URL+"?"+qs).then(r=>r.json()).then(d=>{if(d.status!=="ok")throw new Error(d.message);return d;});
}
function post(params){
  const fd=new FormData();
  Object.entries(params).forEach(([k,v])=>fd.append(k,v));
  return fetch(SCRIPT_URL,{method:"POST",body:fd}).then(r=>r.json()).then(d=>{if(d.status!=="ok")throw new Error(d.message);return d;});
}
function showToast(msg,type="ok"){
  const t=document.getElementById("toast");
  t.textContent=msg;t.className="toast "+(type==="ok"?"ok-t":"err-t")+" show";
  setTimeout(()=>t.classList.remove("show"),2500);
}

window.addEventListener("DOMContentLoaded",()=>{
  const role=sessionStorage.getItem("role");
  const user=sessionStorage.getItem("user");
  const label=sessionStorage.getItem("label");
  if(role&&user){currentRole=role;currentUser=user;enterMain(role,label);}
});
</script>
